name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check plugin entries
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js

      - name: Check compat matrix vs README
        run: npm run compat:check

      - name: Run unit tests
        run: npm test
